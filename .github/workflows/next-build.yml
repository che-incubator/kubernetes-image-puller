name: build-next

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    -
      name: Clone source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    -
      name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    -
      name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
    -
      name: Run tests
      run: make test

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
    -
      name: "Set up QEMU"
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    -
      name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    -
      name: "Docker quay.io Login"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
    -
      name: Clone source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    -
      name: Prepare
      id: prep
      run: |
        set -e
        echo "short_sha1=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "version=next" >> $GITHUB_OUTPUT
    -
      name: "Build and push"
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./build/dockerfiles/Dockerfile
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
        tags:  quay.io/eclipse/kubernetes-image-puller:${{ steps.prep.outputs.version }},quay.io/eclipse/kubernetes-image-puller:${{ steps.prep.outputs.short_sha1 }}
        push: true
