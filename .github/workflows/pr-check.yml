name: pr-check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    -
      name: Clone source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    -
      name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    -
      name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
    -
      name: Run tests
      run: make test

  helm-lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    -
      name: Clone source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    -
      name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
    -
      name: Lint chart
      run: helm lint deploy/helm/
    -
      name: Install kubeconform
      run: |
        curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin/
    -
      name: Validate template rendering
      run: helm template test deploy/helm/ | kubeconform -strict -summary

  build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    -
      name: "Set up QEMU"
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
    -
      name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    -
      name: Clone source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    -
      name: "Test build (all platforms)"
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./build/dockerfiles/Dockerfile
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
        push: false
